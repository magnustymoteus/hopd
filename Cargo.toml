[package]
name = "hyprhopd"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
rust-version = "1.89"
description = "Keyboard-driven pointer control for Hyprland, in the spirit of warpd"
repository = "https://github.com/magnustymoteus/hyprhopd"
readme = "README.md"
keywords = ["hyprland", "wayland", "keyboard", "pointer", "warpd"]
categories = ["command-line-utilities"]
include = ["src/**/*", "protocols/**/*", "examples/hyprhopd.conf", "README.md", "LICENSE"]

[dependencies]
cosmic-text = "0.19.0"
hyprlang = "0.5.0"
inotify = "0.11.5"
log = "0.4.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12.2"
smithay-client-toolkit = "0.21.1"
tiny-skia = "0.12.0"
wayland-backend = "0.3.17"
wayland-client = "0.31.15"
wayland-scanner = "0.31.11"
