# A showcase hyprhopd config: rounded labels, a dimmed window and quick fades.
# Copy it to ~/.config/hypr/hyprhopd.conf. Changes apply as soon as you save.
# Everything here is optional; a missing option keeps its default.

normal {
    # MODS, key, action. A bind for an action replaces that action's default key.
    bind = , h, left
    bind = , j, down
    bind = , k, up
    bind = , l, right
    bind = , e, scroll_down
    bind = , r, scroll_up
    bind = , m, button_left
    bind = , comma, button_middle
    bind = , period, button_right
    bind = , escape, exit

    # Pixels per second; acceleration is added for every second a key stays held.
    speed {
        initial = 220
        acceleration = 900
        max = 2000
    }

    scroll_speed {
        initial = 300
        acceleration = 1600
        max = 9000
    }
}

pane {
    spacing = 70
    # Home-row letters first: the most common labels are the easiest to type.
    chars = asdfghjklqwertyuiopzxcvbnm

    font {
        # family = JetBrains Mono
        size = 15
        weight = bold
    }

    label {
        text_color = rgba(cdd6f4ff)
        typed_color = rgba(f9e2afff)
        background = rgba(1e1e2ee6)
        padding = 2 7
        radius = 6
        border {
            width = 1
            color = rgba(89b4fa80)
        }
    }

    backdrop {
        color = rgba(11111b80)
    }
}

animations {
    # Same syntax as Hyprland's beziers: name, x1, y1, x2, y2.
    bezier = quick, 0.15, 0, 0.1, 1

    pane_in {
        duration = 150
        curve = quick
    }
    pane_out {
        duration = 120
        curve = ease_out
    }
}
